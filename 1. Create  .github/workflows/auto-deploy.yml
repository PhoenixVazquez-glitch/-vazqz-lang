name: Auto Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - run: npm ci
      - run: npm run build
      
      # Auto-fix known issues
      - run: |
          sed -i 's/const outFile = fullPath.replace(\\/\\.vz\\$/, ".wat");/const outFile = fullPath.replace(".vz", ".wat");/' src/cli.ts || true
          sed -i '1s/^/import os from "os";\nimport { execSync } from "child_process";\n/' src/pm/manager.ts || true
          sed -i '/const tar = require/d' src/pm/manager.ts || true
          sed -i '/const { execSync } = require/d' src/pm/manager.ts || true
          
      - run: npm run build
      - run: node dist/cli.js version
      - run: node dist/cli.js run examples/demo.vz
      - run: node dist/cli.js run examples/quantum.vz
      - run: node dist/cli.js run examples/temporal.vz
      - run: node dist/cli.js compile examples/demo.vz
      - run: node dist/cli.js wasm examples/demo.vz

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - run: npm ci
      - run: npm run build
      
      - name: Create tarball
        run: tar -czf vazqz-lang-${{ github.ref_name }}.tar.gz dist/ examples/ README.md package.json
        
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: vazqz-lang-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-vscode:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - run: npm ci
      - run: npm run build
      
      - name: Publish VS Code Extension
        working-directory: ./vscode-extension
        run: |
          npm install
          npm install -g @vscode/vsce
          vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  docker-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
